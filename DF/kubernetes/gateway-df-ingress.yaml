apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ct001-tgw002-df-generator-httproute
  namespace: ct001-tgw002-df-v3
spec:
  parentRefs:
    - name: tgatest-gw
      namespace: kgateway-system
      sectionName: https  
  hostnames:
    - "192.168.2.94:3010"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /ct001/tgw01/tgw002/v3/api/
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: ct001-tgw002-df-generator
          port: 443 
          
      timeouts:
        request: 600s  
    - matches:
        - path:
            type: Exact
            value: /ct001/tgw01/tgw002/v3/api     
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /
      backendRefs:
        - name: ct001-tgw002-df-generator
          port: 443

      timeouts:
        request: 600s